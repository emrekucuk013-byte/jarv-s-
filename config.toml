# Vyron configuration. Edit freely; no code change needed.

[assistant]
name = "Vyron"
purpose = "a personal daily-driver assistant that acts on my behalf, remembers me, and reaches out only when it counts"
tone = "warm, plain-spoken, and brief"

[model]
provider = "anthropic"          # "anthropic" or "fake" (offline, for tests)
name = "claude-opus-5"
max_tokens = 4096
effort = "medium"               # low | medium | high | xhigh | max
# Approximate USD per million tokens, used only for the running cost tally.
input_usd_per_mtok = 5.0
output_usd_per_mtok = 25.0

[notes]
dir = "notes"                   # folder of .md / .txt files the assistant can search

[voice]
ptt_key = "ctrl_r"              # pynput key name held to talk (e.g. ctrl_r, f8, space)
sample_rate = 16000
stt_model = "nova-3"            # Deepgram model
stt_language = "en"
tts_voice_id = "21m00Tcm4TlvDq8ikWAM"   # ElevenLabs voice id (default library voice; change to taste)
tts_model_id = "eleven_turbo_v2_5"     # low-latency ElevenLabs model

[memory]
path = "state/memory.md"        # one fact per line; edit by hand any time
max_facts_in_prompt = 40        # above this, only facts relevant to the current turn are loaded

[heartbeat]
enabled = true
tick_seconds = 5                # how often the loop wakes to see what's due
quiet_hours_start = "22:00"     # non-urgent interruptions wait until quiet hours end
quiet_hours_end = "07:00"
state = "state/heartbeat.json"  # persisted "next due" times so a restart doesn't refire everything
inbox = "state/inbox.json"      # held notices, until you dismiss them

# Each check: name (unique), check (kind: due_reminders | file_watch | ask_agent), every (30s/5m/2h/1d),
# level (log = wait in the inbox | interrupt = tell me now, outside quiet hours | critical = always now).
[[heartbeat.checks]]
name = "due_reminders"
check = "due_reminders"
every = "1m"
level = "interrupt"

[[heartbeat.checks]]
name = "trigger_file"
check = "file_watch"
every = "10s"
path = "state/trigger.txt"      # touch or edit this file to trigger a notice on purpose
level = "log"

[[heartbeat.checks]]
name = "morning_lookahead"
check = "ask_agent"
every = "12h"
level = "log"
enabled = false                 # flip on once you trust it; costs one model call per run
prompt = "Look at the user's reminders for today with list_reminders and say whether anything needs attention."

[safety]
# Tools that always stop for your explicit yes, in addition to those flagged consequential in code.
require_confirmation = ["send_message", "remove_reminder", "forget"]
# Seconds a heartbeat-started action waits for your approval before defaulting to "do nothing, leave a note".
background_confirm_timeout = 0
flag_injected_instructions = true   # wrap tool output that looks like it's giving orders
pause_file = "state/PAUSED"         # kill switch: /pause creates it, /resume removes it, or touch it by hand

[audit]
path = "state/audit.log"            # one JSON line per model call, tool run, confirmation, and notice
