[project]
name = "vyron"
version = "0.1.0"
description = "Vyron: a voice-first personal AI assistant harness"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
voice = [
    "httpx>=0.27",
    "sounddevice>=0.4",
    "numpy>=1.26",
    "pynput>=1.7",
]
dev = ["pytest>=8"]

[project.scripts]
vyron = "vyron.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vyron*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
